[project]
name = "llmpipe"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.12"
dependencies = [
    "annotated-doc==0.0.5",
    "markdown-it-py==4.2.0",
    "mdurl==0.1.2",
    "paramiko>=5.0.0",
    "pygments==2.21.0",
    "rich==15.0.0",
    "shellingham==1.5.4",
    "typer==0.27.1",
]

[project.scripts]
llmpipe = "llmpipe.main:app"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
